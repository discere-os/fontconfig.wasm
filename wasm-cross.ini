[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
strip = 'emstrip'
pkg-config = 'pkg-config'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[built-in options]
c_std = 'gnu99'
cpp_std = 'gnu++17'
buildtype = 'release'
default_library = 'static'
c_args = ['-O3', '-msimd128', '-fPIC', '-DFONTCONFIG_WASM_NATIVE', '-DFC_ENABLE_WASM_SIMD', '-DHAVE_IDBFS', '-DNDEBUG']
cpp_args = ['-O3', '-msimd128', '-fPIC', '-DFONTCONFIG_WASM_NATIVE', '-DFC_ENABLE_WASM_SIMD', '-DHAVE_IDBFS', '-DNDEBUG']
c_link_args = ['-O3', '-msimd128']
cpp_link_args = ['-O3', '-msimd128']