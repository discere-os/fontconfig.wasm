# Emscripten cross-compilation file for fontconfig.wasm
# Based on ecosystem System Tier 3 (Graphics) standards

[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'
pkgconfig = 'pkg-config'

[properties]
c_args = [
  '-msimd128',                    # SIMD acceleration for font processing
  '-DFONTCONFIG_WASM_NATIVE',     # Enable WASM-specific code paths
  '-O3',                          # Maximum optimization for graphics libraries
  '-flto',                        # Link-time optimization
  '-DHAVE_IDBFS',                 # Enable persistent filesystem support
  '-DFC_ENABLE_WASM_SIMD'         # Enable SIMD font matching operations
]

c_link_args = [
  '-s WASM=1',
  '-s MODULARIZE=1',
  '-s EXPORT_ES6=1',
  '-s INITIAL_MEMORY=128MB',      # Graphics tier memory allocation
  '-s MAXIMUM_MEMORY=2GB',
  '-s ALLOW_MEMORY_GROWTH=1',
  '-s FORCE_FILESYSTEM=1',        # Virtual filesystem for fonts
  '-s ASYNCIFY=1',               # Async font loading support
  '-lidbfs.js',                  # Persistent storage
  '-s ENVIRONMENT=web,worker,node',
  '-s STACK_SIZE=5MB',
  '-s ASSERTIONS=0'              # Production build
]

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'